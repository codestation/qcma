id: dev.megpoid.Qcma
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: qcma
rename-desktop-file: qcma.desktop
rename-icon: qcma
finish-args:
  - --require-version=1.14.6
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  # Direct libusb access is required. --device=usb is unavailable in
  # Flatpak 1.14 as shipped by Ubuntu 24.04.
  - --device=all
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=home

modules:
  - name: libusb
    config-opts:
      - --disable-static
    cleanup:
      - /lib/*.la
      - /lib/pkgconfig
      - /include
    sources:
      - type: archive
        url: https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2
        sha256: fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf
    post-install:
      - install -Dm644 COPYING /app/share/licenses/libusb/COPYING

  - name: libvitamtp
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
    cleanup:
      - /lib/*.la
      - /lib/pkgconfig
      - /include
    sources:
      - type: git
        url: https://github.com/codestation/vitamtp.git
        tag: v2.5.12

  - name: qcma
    buildsystem: cmake-ninja
    build-options:
      prepend-pkg-config-path: /app/lib/pkgconfig:/app/lib64/pkgconfig
    config-opts:
      - -DBUILD_TESTING=ON
    sources:
      - type: git
        url: https://github.com/codestation/qcma.git
        tag: v0.5.4
    post-install:
      - ctest --test-dir . --output-on-failure
      - install -Dm644 dev.megpoid.Qcma.metainfo.xml /app/share/metainfo/dev.megpoid.Qcma.metainfo.xml
      - install -Dm644 COPYING /app/share/licenses/qcma/COPYING
